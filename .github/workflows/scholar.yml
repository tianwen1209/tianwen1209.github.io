name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_scholar.py"
      - ".github/workflows/scholar.yml"

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Google Scholar stats
        run: python scripts/update_scholar.py vpKvXRgAAAAJ data/scholar.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/scholar.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.js
          git commit -m "Update Google Scholar stats"
          git push
